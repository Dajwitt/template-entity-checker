<script>
const data={"pages": {"de/index": {"title": "Template Entity Checker", "html": "<h1>Template Entity Checker<\/h1>\n<p><strong>Dokumentationsstand: Version 0.1.3<\/strong> · Home Assistant Custom Integration<\/p>\n<p>Template Entity Checker prüft über die Benutzeroberfläche erstellte Template-Helfer auf statische Entity-Referenzen, die nicht mehr existieren.<\/p>\n<p>Die Integration liest Template-Helfer über die öffentliche Config-Entry-API. Sie rendert oder verändert <strong>keine<\/strong> Templates, repariert keine Referenzen, rät keine dynamischen Entity-IDs und liest oder schreibt keine <code>.storage<\/code>-Dateien.<\/p>\n<blockquote>Die aktuelle öffentliche stabile Version ist <code>0.1.3<\/code>.<\/blockquote>\n<h2>Scope<\/h2>\n<p><strong>Nur UI-basierte Template-Helfer.<\/strong> Templates aus <code>configuration.yaml<\/code>, <code>templates.yaml<\/code>, Packages oder anderen YAML-Dateien werden nicht gescannt.<\/p>\n<h2>Neu in 0.1.3<\/h2>\n<ul><li>durchsuchbare Auswahl für das optionale Helfer-Label; freie Eingaben sind gesperrt, eine zuvor gespeicherte gelöschte Label-ID bleibt zum Entfernen sichtbar und gespeichert werden kann höchstens ein Label<\/li><\/ul>\n<h2>Neu in 0.1.2<\/h2>\n<ul><li><code>has_value<\/code> als Funktion, Filter und Jinja-Test<\/li><li>suchbare Mehrfachauswahl für exakt ignorierte Entity-IDs; fehlende IDs bleiben frei eingebbar<\/li><li>optionaler Ausschluss kompletter Template-Helfer über ein frei gewähltes Home-Assistant-Label<\/li><li>transparente Angaben zu wirksamem Label, ignorierten Helfern und ignorierten Funden<\/li><li>nativer Ein/Aus-Schalter für persistente Benachrichtigungen<\/li><\/ul>\n<h2>Schnellstart<\/h2>\n<ol><li><a href=\"#de/installation\" data-page-link=\"installation\">Installation<\/a> über HACS<\/li><li><a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a> über <strong>Einstellungen → Geräte &amp; Dienste<\/strong><\/li><li><a href=\"#de/sensor\" data-page-link=\"sensor\">Ergebnisse prüfen<\/a> über <code>sensor.template_entity_checker<\/code><\/li><\/ol>\n<h2>Dokumentation<\/h2><div class=\"card-grid\"><a class=\"card\" href=\"#de/installation\" data-page-link=\"installation\"><strong>Installation<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/configuration\" data-page-link=\"configuration\"><strong>Konfiguration<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/how-it-works\" data-page-link=\"how-it-works\"><strong>Funktionsweise<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/supported-syntax\" data-page-link=\"supported-syntax\"><strong>Unterstützte Syntax<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/sensor\" data-page-link=\"sensor\"><strong>Result-Sensor<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/services\" data-page-link=\"services\"><strong>Aktion scan_now<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/events\" data-page-link=\"events\"><strong>Events<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/notifications\" data-page-link=\"notifications\"><strong>Benachrichtigungen<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/ignore-list\" data-page-link=\"ignore-list\"><strong>Ausschlüsse<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/diagnostics\" data-page-link=\"diagnostics\"><strong>Diagnostik<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/limitations\" data-page-link=\"limitations\"><strong>Bekannte Grenzen<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/troubleshooting\" data-page-link=\"troubleshooting\"><strong>Fehlerbehebung<\/strong><span>Öffnen<\/span><\/a><a class=\"card\" href=\"#de/requirements\" data-page-link=\"requirements\"><strong>Anforderungen<\/strong><span>Öffnen<\/span><\/a><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>Bereich<\/th><th>Inhalt<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#de/installation\" data-page-link=\"installation\">Installation<\/a><\/td><td>HACS- und manuelle Installation<\/td><\/tr><tr><td><a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a><\/td><td>Config Flow, Options Flow, Einstellungen<\/td><\/tr><tr><td><a href=\"#de/how-it-works\" data-page-link=\"how-it-works\">Funktionsweise<\/a><\/td><td>Scan-Prozess und Template-Helfer-Typen<\/td><\/tr><tr><td><a href=\"#de/supported-syntax\" data-page-link=\"supported-syntax\">Unterstützte Syntax<\/a><\/td><td>Statische Jinja-Referenzen mit Beispielen<\/td><\/tr><tr><td><a href=\"#de/sensor\" data-page-link=\"sensor\">Result-Sensor<\/a><\/td><td>Zustand und Attribute<\/td><\/tr><tr><td><a href=\"#de/services\" data-page-link=\"services\">Aktion<\/a><\/td><td><code>template_entity_checker.scan_now<\/code><\/td><\/tr><tr><td><a href=\"#de/events\" data-page-link=\"events\">Events<\/a><\/td><td><code>template_entity_checker_result_changed<\/code><\/td><\/tr><tr><td><a href=\"#de/notifications\" data-page-link=\"notifications\">Benachrichtigungen<\/a><\/td><td>Persistente Benachrichtigung<\/td><\/tr><tr><td><a href=\"#de/ignore-list\" data-page-link=\"ignore-list\">Ausschlüsse<\/a><\/td><td>Exakte IDs und Helfer-Label<\/td><\/tr><tr><td><a href=\"#de/diagnostics\" data-page-link=\"diagnostics\">Diagnostik<\/a><\/td><td>Diagnostics-Download und Inhalt<\/td><\/tr><tr><td><a href=\"#de/limitations\" data-page-link=\"limitations\">Bekannte Grenzen<\/a><\/td><td>Was nicht aufgelöst werden kann<\/td><\/tr><tr><td><a href=\"#de/troubleshooting\" data-page-link=\"troubleshooting\">Fehlerbehebung<\/a><\/td><td>Probleme eingrenzen<\/td><\/tr><tr><td><a href=\"#de/requirements\" data-page-link=\"requirements\">Anforderungen<\/a><\/td><td>Versionen und Plattformen<\/td><\/tr><\/tbody><\/table><\/div>"}, "de/installation": {"title": "Installation", "html": "<h1>Installation<\/h1>\n<p>Template Entity Checker wird als Custom-Integration für Home Assistant installiert. Die aktuelle öffentliche stabile Version ist <code>0.1.3<\/code>.<\/p>\n<h2>Voraussetzungen<\/h2>\n<ul><li>Home Assistant 2026.7.3 oder neuer<\/li><li>eine aktuelle HACS-Version<\/li><\/ul>\n<h2>HACS-Installation<\/h2>\n<ol><li>Öffne <strong>HACS<\/strong> in Home Assistant.<\/li><li>Öffne das Dreipunkt-Menü oben rechts.<\/li><li>Wähle <strong>Custom repositories<\/strong>.<\/li><li>Gib diese Repository-URL ein:<\/li><\/ol>\n<pre><code class=\"language-text\">   https://github.com/Dajwitt/template-entity-checker<\/code><\/pre>\n<ol start=\"5\"><li>Wähle die Kategorie <strong>Integration<\/strong> und füge das Repository hinzu.<\/li><li>Öffne <strong>Template Entity Checker<\/strong> in HACS und wähle <strong>Download<\/strong>.<\/li><li>Starte Home Assistant neu.<\/li><li>Fahre mit <a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a> fort.<\/li><\/ol>\n<p>Füge nichts zu <code>configuration.yaml<\/code> hinzu.<\/p>\n<h2>Manuelle Installation<\/h2>\n<ol><li>Lade das neueste Release von GitHub herunter.<\/li><li>Kopiere <code>custom_components/template_entity_checker<\/code> nach:<\/li><\/ol>\n<pre><code class=\"language-text\">   /config/custom_components/template_entity_checker<\/code><\/pre>\n<ol start=\"3\"><li>Starte Home Assistant neu.<\/li><li>Fahre mit <a href=\"#de/configuration\" data-page-link=\"configuration\">Konfiguration<\/a> fort.<\/li><\/ol>"}, "de/configuration": {"title": "Konfiguration", "html": "<h1>Konfiguration<\/h1>\n<p>Konfiguration und spätere Änderungen erfolgen über Home Assistants Config Flow und Options Flow. Eine YAML-Konfiguration ist nicht erforderlich.<\/p>\n<h2>Ersteinrichtung<\/h2>\n<p>Nach Installation und Neustart:<\/p>\n<ol><li>Öffne <strong>Einstellungen → Geräte &amp; Dienste<\/strong>.<\/li><li>Wähle <strong>Integration hinzufügen<\/strong>.<\/li><li>Suche nach <strong>Template Entity Checker<\/strong>.<\/li><li>Setze das Scan-Intervall in Minuten (Standard: 15).<\/li><li>Aktiviere oder deaktiviere persistente Benachrichtigungen.<\/li><li>Wähle optional exakt zu ignorierende Entity-IDs aus oder gib fehlende IDs frei ein.<\/li><li>Suche und wähle optional ein Home-Assistant-Label für komplett zu ignorierende Template-Helfer.<\/li><\/ol>\n<h2>Konfigurationsfelder<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Feld<\/th><th>Typ<\/th><th>Standard<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td>Scan-Intervall<\/td><td>Ganzzahl (1–1440)<\/td><td>15 Minuten<\/td><td>Zeit zwischen automatischen Scans<\/td><\/tr><tr><td>Benachrichtigungen<\/td><td>Ein/Aus<\/td><td>An<\/td><td>Persistente Benachrichtigung bei aktiven Funden<\/td><\/tr><tr><td>Exakt ignorierte Entity-IDs<\/td><td>suchbare Mehrfachauswahl mit freier Eingabe<\/td><td>leer<\/td><td>Unterdrückt die gewählten fehlenden Ziel-IDs vollständig<\/td><\/tr><tr><td>Label für ignorierte Template-Helfer<\/td><td>durchsuchbare Auswahl ohne freie Eingabe, maximal eines<\/td><td>leer<\/td><td>Unterdrückt Funde aus Helfern, deren erzeugte Entity dieses Label direkt trägt<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Suchbare Entity-Auswahl<\/h2>\n<p>Im Options Flow enthält die Auswahlliste:<\/p>\n<ul><li>aktuell gemeldete fehlende Entity-IDs,<\/li><li>bereits ignorierte Funde,<\/li><li>schon gespeicherte Ignore-IDs.<\/li><\/ul>\n<p>Da eine fehlende Entity nicht mehr in Home Assistants Entity Registry stehen muss, sind weiterhin eigene syntaktisch gültige Entity-IDs eingebbar.<\/p>\n<h2>Helfer über ein Label ausschließen<\/h2>\n<p>Das optionale Label wird aus Home Assistants aktueller Label-Registry gewählt und intern über seine stabile Label-ID gespeichert.<\/p>\n<ul><li>Die Auswahl ist durchsuchbar und erlaubt keine freie Eingabe. Sie bietet aktuelle Labels sowie gegebenenfalls die zuvor gespeicherte ID eines gelöschten Labels an, damit sie entfernt werden kann.<\/li><li>Es kann höchstens ein Label gespeichert werden.<\/li><li>Das Label muss direkt an der vom Template-Helfer erzeugten Entity gesetzt sein.<\/li><li>Labels von Geräten oder Bereichen werden nicht vererbt.<\/li><li>Eine Umbenennung des Labels bleibt wirksam.<\/li><li>Wird das gespeicherte Label gelöscht, werden keine Helfer mehr darüber ausgeschlossen; der Scan bleibt vollständig und meldet das Label als nicht verfügbar.<\/li><li>Exakte Entity-IDs und Label-Ausschluss können parallel verwendet werden.<\/li><\/ul>\n<h2>Options Flow<\/h2>\n<p>Alle Felder können später über <strong>Einstellungen → Geräte &amp; Dienste → Template Entity Checker → Konfigurieren<\/strong> geändert werden. Nach dem Speichern wird die Integration neu geladen und scannt mit den neuen Einstellungen.<\/p>\n<h2>Single Instance und Migration<\/h2>\n<p>Es wird nur eine Instanz unterstützt. Ein zweiter Setup-Versuch wird abgebrochen.<\/p>\n<p>Bestehende Config Entries der alten Flow-Version 1 werden automatisch auf Version 2 migriert. Die frühere Auswahl einzelner Template-Helfer-Typen wird aus Daten und Optionen entfernt; seitdem werden alle bestätigten Typen automatisch geprüft. Alte textbasierte Ignore-Werte bleiben lesbar und werden beim nächsten Speichern in die neue Liste überführt.<\/p>\n<h2>Bewusste Grenzen<\/h2>\n<ul><li>keine Wildcards wie <code>sensor.wohnraum_*<\/code><\/li><li>keine Auswahl einzelner Template-Helfer-Typen<\/li><li>keine Dashboard-Auswahl<\/li><li>keine YAML-Konfiguration<\/li><\/ul>"}, "de/how-it-works": {"title": "Funktionsweise", "html": "<h1>Funktionsweise<\/h1>\n<h2>Scan-Prozess<\/h2>\n<pre><code class=\"language-text\">Home Assistant vollständig gestartet\n        │\n        ▼\nUI-Template-Helfer über Config Entries laden\n        │\n        ▼\nbestätigte Template-Felder extrahieren\n        │\n        ▼\nJinja statisch parsen, niemals rendern\n        │\n        ▼\nReferenzen gegen State Machine und Entity Registry prüfen\n        │\n        ▼\nexakte Ignore-IDs und direktes Helfer-Label fundweise anwenden\n        │\n        ▼\nSensor aktualisieren\nBenachrichtigung bei geändertem vollständigem Ergebnis anpassen\nEvent bei geändertem vollständigem Ergebnis feuern<\/code><\/pre>\n<h2>Template-Helfer laden<\/h2>\n<p>Die Integration nutzt Home Assistants öffentliche Config-Entry-API nur lesend.<\/p>\n<ul><li>kein direkter <code>.storage<\/code>-Zugriff<\/li><li>kein Rendern oder Ausführen von Templates<\/li><li>nur bestätigte <code>TemplateSelector<\/code>-Felder<\/li><li>bestätigtes Schema 1.0 bis 1.2<\/li><li>neuere oder unbekannte Schemata werden als <code>load_errors<\/code> gemeldet, nicht geraten<\/li><\/ul>\n<h2>Unterstützte Template-Helfer-Typen<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Typ<\/th><th>Gescannte Stammfelder<\/th><\/tr><\/thead><tbody><tr><td><code>alarm_control_panel<\/code><\/td><td><code>value_template<\/code><\/td><\/tr><tr><td><code>binary_sensor<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>button<\/code><\/td><td>keine Stammfelder<\/td><\/tr><tr><td><code>cover<\/code><\/td><td><code>state<\/code>, <code>position<\/code><\/td><\/tr><tr><td><code>device_tracker<\/code><\/td><td><code>in_zones<\/code>, <code>latitude<\/code>, <code>longitude<\/code><\/td><\/tr><tr><td><code>event<\/code><\/td><td><code>event_type<\/code>, <code>event_types<\/code><\/td><\/tr><tr><td><code>fan<\/code><\/td><td><code>state<\/code>, <code>percentage<\/code><\/td><\/tr><tr><td><code>image<\/code><\/td><td><code>url<\/code><\/td><\/tr><tr><td><code>light<\/code><\/td><td><code>state<\/code>, <code>level<\/code>, <code>hs<\/code>, <code>temperature<\/code><\/td><\/tr><tr><td><code>lock<\/code><\/td><td><code>state<\/code>, <code>code_format<\/code><\/td><\/tr><tr><td><code>number<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>select<\/code><\/td><td><code>state<\/code>, <code>options<\/code><\/td><\/tr><tr><td><code>sensor<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>switch<\/code><\/td><td><code>value_template<\/code><\/td><\/tr><tr><td><code>update<\/code><\/td><td><code>installed_version<\/code>, <code>latest_version<\/code>, <code>in_progress<\/code>, <code>release_summary<\/code>, <code>release_url<\/code>, <code>title<\/code>, <code>update_percentage<\/code><\/td><\/tr><tr><td><code>vacuum<\/code><\/td><td><code>state<\/code>, <code>fan_speed<\/code><\/td><\/tr><tr><td><code>weather<\/code><\/td><td><code>condition<\/code>, <code>humidity<\/code>, <code>temperature<\/code>, <code>forecast_daily<\/code>, <code>forecast_hourly<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Bei allen Typen wird zusätzlich <code>advanced_options.availability<\/code> geprüft. Beim <code>device_tracker<\/code> kommt <code>advanced_options.location_accuracy<\/code> hinzu. Nicht vorhandene Felder zählen nicht als Quelle; vorhandene leere Felder werden dagegen als gescannte Quelle gezählt.<\/p>\n<h2>Wann gilt eine Entity als fehlend?<\/h2>\n<p>Eine Entity wird nur gemeldet, wenn sie weder in der State Machine noch in der Entity Registry existiert. <code>unavailable<\/code>, <code>unknown<\/code>, deaktiviert oder momentan ohne State gilt nicht als fehlend, solange ein Registry-Eintrag vorhanden ist.<\/p>\n<h2>Ausschlüsse<\/h2>\n<p>Exakte Ignore-IDs unterdrücken alle Funde dieser Ziel-ID. Das optionale Helfer-Label wird direkt an den von Template-Helfern erzeugten Entities ausgewertet und unterdrückt nur Funde der betroffenen Quellen. Beide Wege werden nach <code>ignored_matches<\/code> verschoben.<\/p>\n<h2>Automatischer und manueller Scan<\/h2>\n<p>Nach dem vollständigen Start führt die Integration den ersten Scan aus. Danach scannt sie im konfigurierten Intervall. Die Aktion <code>template_entity_checker.scan_now<\/code> fordert einen sofortigen Lauf an. Ein Async-Lock verhindert parallele Scans; ein weiterer Auslöser wartet.<\/p>\n<h2>Partielles Fehlschlagen<\/h2>\n<p>Ladefehler einzelner Quellen führen zu <code>partial_error<\/code>. Erfolgreich geladene Quellen bleiben im Sensor sichtbar. Ein unvollständiger Lauf verändert weder die bestehende Benachrichtigung noch die Ergebnis-Baseline für Events.<\/p>\n<h2>Gruppierung<\/h2>\n<p>Funde werden nach Entity-ID gruppiert. Je Helfer, Feld und Referenz bleiben Helfername, Typ, Quell-ID, Originalreferenz, Vorkommenszahl sowie alle Zeilen- und Spaltenpositionen erhalten.<\/p>"}, "de/supported-syntax": {"title": "Unterstützte Syntax", "html": "<h1>Unterstützte Syntax<\/h1>\n<p>Template Entity Checker extrahiert <strong>statisch beweisbare<\/strong> Entity-Referenzen aus Jinja-Templates. Das Template wird nie gerendert. Der Parser analysiert Syntax, Positionen und lokale Namensbindungen.<\/p>\n<h2>Funktionsaufrufe<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.wohnraum_beispieltemperatur&#x27;) }}\n{{ state_attr(&#x27;sensor.wohnraum_beispieltemperatur&#x27;, &#x27;temperature&#x27;) }}\n{{ is_state(&#x27;binary_sensor.terrassentuer_beispielkontakt&#x27;, &#x27;on&#x27;) }}\n{{ is_state_attr(&#x27;sensor.heizkreis_beispielstatus&#x27;, &#x27;mode&#x27;, &#x27;heating&#x27;) }}\n{{ has_value(&#x27;sensor.gartenhaus_beispielwert&#x27;) }}<\/code><\/pre>\n<h2><code>has_value<\/code> als Filter und Test<\/h2>\n<p>Home Assistant unterstützt <code>has_value<\/code> in drei Formen; alle drei werden geprüft:<\/p>\n<pre><code class=\"language-jinja2\">{{ has_value(&#x27;sensor.gartenhaus_beispielwert&#x27;) }}\n{{ &#x27;sensor.gartenhaus_beispielwert&#x27; | has_value }}\n{{ &#x27;sensor.gartenhaus_beispielwert&#x27; is has_value }}\n{{ &#x27;sensor.gartenhaus_beispielwert&#x27; is not has_value }}<\/code><\/pre>\n<p>Auch geklammerte Stringliterale werden erkannt. Dynamische Operanden erzeugen eine Diagnose, aber keinen geratenen Fund.<\/p>\n<pre><code class=\"language-jinja2\">{{ entity_variable | has_value }}\n{{ entity_variable is has_value }}<\/code><\/pre>\n<h2>Dot-Notation<\/h2>\n<pre><code class=\"language-jinja2\">{{ states.sensor.wohnraum_beispieltemperatur.state }}\n{{ states.binary_sensor.terrassentuer_beispielkontakt }}<\/code><\/pre>\n<h2><code>expand()<\/code><\/h2>\n<pre><code class=\"language-jinja2\">{{ expand([&#x27;sensor.wohnraum_beispieltemperatur&#x27;, &#x27;sensor.keller_beispieltemperatur&#x27;]) }}\n{{ expand(&#x27;sensor.wohnraum_beispieltemperatur&#x27;, &#x27;sensor.keller_beispieltemperatur&#x27;) }}<\/code><\/pre>\n<p>Literale Entity-IDs in Listen, Tupeln und mehreren Argumenten werden einzeln geprüft. Bei gemischten Containern werden statische Elemente geprüft; der dynamische Rest wird genau einmal als Diagnose gemeldet.<\/p>\n<h2>Bewusst ignorierte Lookalikes<\/h2>\n<p>Folgendes ist keine statische Home-Assistant-Referenz:<\/p>\n<ul><li>Funktionsnamen in normalem Text oder Jinja-Kommentaren<\/li><li>Text innerhalb eines Stringliterals, der nur wie ein Aufruf aussieht<\/li><li>gleichnamige Methoden auf anderen Objekten, etwa <code>helper.expand(...)<\/code><\/li><li>Makro-, Filterblock- und gewöhnliche Jinja-Testnamen<\/li><li>lokal gebundene Namen anstelle der globalen Home-Assistant-Funktion<\/li><\/ul>\n<p><code>has_value<\/code> ist die gezielte Ausnahme bei Jinja-Filtern und -Tests, weil Home Assistant diese Formen offiziell bereitstellt.<\/p>\n<pre><code class=\"language-jinja2\">{# states(&#x27;sensor.kommentar_beispiel&#x27;) #}\n{{ &quot;states(&#x27;sensor.string_beispiel&#x27;)&quot; }}\n{{ helper.expand([&#x27;sensor.methoden_beispiel&#x27;]) }}\n{{ expand([&#x27;sensor.echter_beispielfund&#x27;]) }}<\/code><\/pre>\n<h2>Lokale Variablen und Scopes<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.vor_bindung_beispiel&#x27;) }}\n{% set states = local_helper %}\n{{ states(&#x27;sensor.nach_bindung_beispiel&#x27;) }}<\/code><\/pre>\n<p>Der erste globale Aufruf bleibt erkennbar. Ab der lokalen Bindung wird <code>states<\/code> nicht mehr als Home-Assistant-Funktion behandelt. Bindungen in untergeordneten Scopes verstecken einen späteren globalen Aufruf außerhalb dieses Scopes nicht.<\/p>\n<h2>Dynamische Referenzen<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.&#x27; ~ raum) }}\n{{ state_attr(entity_variable, &#x27;temperature&#x27;) }}\n{{ expand([&#x27;sensor.wohnraum_beispieltemperatur&#x27;, entity_variable]) }}<\/code><\/pre>\n<p>Dynamische IDs werden nicht aufgelöst. Sie erzeugen <code>dynamic_entity_reference<\/code>, aber niemals eine erfundene fehlende Entity.<\/p>\n<h2>Duplikate und Fundstellen<\/h2>\n<p>Mehrere Vorkommen derselben ID werden zu einem Fund pro Helfer, Feld und Referenz gruppiert. <code>occurrence_count<\/code> und alle Zeilen-/Spaltenpositionen bleiben erhalten.<\/p>"}, "de/sensor": {"title": "Result-Sensor", "html": "<h1>Result-Sensor<\/h1>\n<p>Die Integration erstellt standardmäßig <code>sensor.template_entity_checker<\/code>. Home Assistants Entity Registry bleibt führend; der Sensor kann umbenannt werden.<\/p>\n<h2>Zustand<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Zustand<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>0<\/code><\/td><td>keine aktiven fehlenden Entities<\/td><\/tr><tr><td><code>N<\/code><\/td><td>N eindeutige fehlende, nicht ignorierte Entity-IDs<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Attribute<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribut<\/th><th>Typ<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td><code>status<\/code><\/td><td>string<\/td><td><code>ok<\/code>, <code>missing_entities<\/code>, <code>partial_error<\/code>, <code>update_failed<\/code> oder <code>waiting<\/code><\/td><\/tr><tr><td><code>complete<\/code><\/td><td>bool<\/td><td><code>true<\/code>, wenn alle Quellen fehlerfrei geladen wurden<\/td><\/tr><tr><td><code>scan_interval_minutes<\/code><\/td><td>int<\/td><td>konfiguriertes Scan-Intervall<\/td><\/tr><tr><td><code>template_types_scanned<\/code><\/td><td>list<\/td><td>tatsächlich gescannte Template-Typen<\/td><\/tr><tr><td><code>sources_scanned<\/code><\/td><td>int<\/td><td>Anzahl gescannter Template-Felder<\/td><\/tr><tr><td><code>references_checked<\/code><\/td><td>int<\/td><td>Anzahl statisch extrahierter Referenzvorkommen<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>dict<\/td><td>aktive Funde, gruppiert nach Entity-ID<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>list<\/td><td>konfigurierte exakte Ignore-IDs<\/td><\/tr><tr><td><code>ignored_helper_label<\/code><\/td><td>dict/null<\/td><td>Label-ID, aktueller Name und Verfügbarkeit<\/td><\/tr><tr><td><code>ignored_helper_sources<\/code><\/td><td>list<\/td><td>tatsächlich über das Label ausgeschlossene Helfer<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>dict<\/td><td>durch beide Ausschlussarten unterdrückte Funde<\/td><\/tr><tr><td><code>parser_diagnostics<\/code><\/td><td>list<\/td><td>dynamische, ungültige oder syntaktisch fehlerhafte Referenzen<\/td><\/tr><tr><td><code>load_errors<\/code><\/td><td>list<\/td><td>Quell-Ladefehler<\/td><\/tr><tr><td><code>last_scan<\/code><\/td><td>string/null<\/td><td>ISO-Zeitstempel des letzten Scans<\/td><\/tr><tr><td><code>last_error<\/code><\/td><td>string/null<\/td><td>letzte Coordinator-Exception<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Beispiel: aktiver Fund<\/h2>\n<pre><code class=\"language-yaml\">sensor.gartenhaus_beispiel_altwert:\n  - helper: Durchschnitt Gartenhaus\n    source_type: template_helper\n    source_id: example_internal_id\n    template_field: state\n    template_type: sensor\n    reference: &quot;states(&#x27;sensor.gartenhaus_beispiel_altwert&#x27;)&quot;\n    occurrence_count: 1\n    locations:\n      - line: 4\n        column: 2<\/code><\/pre>\n<h2>Beispiel: gewähltes Helfer-Label<\/h2>\n<pre><code class=\"language-yaml\">ignored_helper_label:\n  label_id: beispiel_pruefung_ignorieren\n  name: Prüfung ignorieren\n  available: true\nignored_helper_sources:\n  - source_id: example_helper_entry_id\n    helper: Gartenhaus Vergleich<\/code><\/pre>\n<p>Wird das gespeicherte Label später gelöscht, bleibt seine ID transparent, <code>name<\/code> wird <code>null<\/code>, <code>available<\/code> wird <code>false<\/code> und es werden keine Quellen dadurch ausgeschlossen.<\/p>\n<h2>Status-Werte<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Status<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>ok<\/code><\/td><td>vollständiger Scan, keine aktiven Funde<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>vollständiger Scan mit aktiven Funden<\/td><\/tr><tr><td><code>partial_error<\/code><\/td><td>mindestens eine Quelle konnte nicht geladen werden<\/td><\/tr><tr><td><code>update_failed<\/code><\/td><td>der gesamte Coordinator-Lauf ist fehlgeschlagen<\/td><\/tr><tr><td><code>waiting<\/code><\/td><td>Integration geladen, erster Scan steht noch aus<\/td><\/tr><\/tbody><\/table><\/div>"}, "de/services": {"title": "Aktion", "html": "<h1>Aktion<\/h1>\n<h2><code>template_entity_checker.scan_now<\/code><\/h2>\n<p>Löst einen sofortigen Scan aller UI-basierten Template-Helfer aus.<\/p>\n<h3>Parameter<\/h3>\n<p>Keine.<\/p>\n<h3>Beispiel: Developer Tools<\/h3>\n<pre><code class=\"language-yaml\">action: template_entity_checker.scan_now<\/code><\/pre>\n<h3>Beispiel: Script<\/h3>\n<pre><code class=\"language-yaml\">script:\n  template_check:\n    alias: &quot;Template-Check&quot;\n    sequence:\n      - action: template_entity_checker.scan_now<\/code><\/pre>\n<h3>Serialisierung<\/h3>\n<p>Wenn ein Scan bereits läuft, wartet die ausgelöste Aktion auf die Sperre. Scans laufen nie parallel.<\/p>"}, "de/events": {"title": "Events", "html": "<h1>Events<\/h1>\n<h2><code>template_entity_checker_result_changed<\/code><\/h2>\n<p>Nach dem ersten vollständigen Scan, der eine Baseline etabliert, feuert die Integration ein Event, sobald sich die strukturierte Menge der aktiven <code>missing_entities<\/code> ändert.<\/p>\n<h3>Wann wird gefeuert?<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Bedingung<\/th><th>feuert?<\/th><\/tr><\/thead><tbody><tr><td>Ergebnis ändert sich nach Baseline<\/td><td>ja<\/td><\/tr><tr><td>Ergebnis unverändert<\/td><td>nein<\/td><\/tr><tr><td>Partielles Quell-Laden fehlgeschlagen<\/td><td>nein<\/td><\/tr><tr><td>Erster Scan (Baseline-Erstellung)<\/td><td>nein<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Event-Daten<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Feld<\/th><th>Typ<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td><code>previous_count<\/code><\/td><td>int<\/td><td>Anzahl fehlender Entities vorher<\/td><\/tr><tr><td><code>current_count<\/code><\/td><td>int<\/td><td>Anzahl fehlender Entities aktuell<\/td><\/tr><tr><td><code>added_entities<\/code><\/td><td>list<\/td><td>Neu hinzugekommene Entity-IDs (sortiert)<\/td><\/tr><tr><td><code>removed_entities<\/code><\/td><td>list<\/td><td>Nicht mehr fehlende Entity-IDs (sortiert)<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>dict<\/td><td>Aktuelles vollständiges Ergebnis<\/td><\/tr><tr><td><code>scan_time<\/code><\/td><td>string<\/td><td>ISO-Zeitstempel des Scans<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Beispiel: Event-Trigger<\/h3>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Fehlende Template-Entities geändert&quot;\n    trigger:\n      - platform: event\n        event_type: template_entity_checker_result_changed\n    action:\n      - action: persistent_notification.create\n        data:\n          title: &quot;Template-Check aktualisiert&quot;\n          message: &gt;\n            {{ trigger.event.data.previous_count }} →\n            {{ trigger.event.data.current_count }} fehlende Entities.\n            Neu: {{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}<\/code><\/pre>\n<h3>Beispiel: Nur bei neuen Entities<\/h3>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Neue fehlende Template-Entities&quot;\n    trigger:\n      - platform: event\n        event_type: template_entity_checker_result_changed\n    condition:\n      - condition: template\n        value_template: &quot;{{ trigger.event.data.added_entities | length &gt; 0 }}&quot;\n    action:\n      - action: persistent_notification.create\n        data:\n          title: &quot;Neue fehlende Entities&quot;\n          message: &quot;{{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}&quot;<\/code><\/pre>"}, "de/notifications": {"title": "Benachrichtigungen", "html": "<h1>Benachrichtigungen<\/h1>\n<p>Wenn Benachrichtigungen aktiviert sind, verwaltet die Integration eine einzelne persistente Notification.<\/p>\n<h2>Verhalten<\/h2>\n<ul><li><strong>Eine<\/strong> feste Notification-ID — keine Duplikate bei wiederholten Scans<\/li><li>Nur bei <strong>verändertem<\/strong> komplettem Ergebnis wird die Notification aktualisiert<\/li><li>Identische Ergebnisse erzeugen keine neue Notification<\/li><li>Ergebnisse werden nach Template-Helfer gruppiert<\/li><li>Ein sauberer Scan (0 fehlende) entfernt die Notification<\/li><li>Deaktivieren von Benachrichtigungen entfernt die Notification ebenfalls<\/li><li>Ausschließlich ignorierte Funde erzeugen keine Notification<\/li><\/ul>\n<h2>Partielles Fehlschlagen<\/h2>\n<p>Bei einem Teil-Fehler (ein Template-Helfer nicht ladbar) wird die bestehende Notification <strong>nicht<\/strong> verändert — unvollständige Eingaben dürfen kein echtes Problem verstecken.<\/p>\n<h2>Beispiel: Notification-Text (Deutsch)<\/h2>\n<pre><code>Template Entity Checker: 2 fehlende Entities\n\n**Template-Helfer**\n\nDurchschnitt Luftfeuchte\n• sensor.wohnraum_doku_altwert\n• sensor.keller_doku_altwert\n\nVollständige Liste: Sensorattribut `missing_entities`<\/code><\/pre>\n<h2>Sprache<\/h2>\n<p>Titel und Text folgen der HA-Spracheinstellung (Deutsch oder Englisch).<\/p>"}, "de/ignore-list": {"title": "Ausschlüsse", "html": "<h1>Ausschlüsse<\/h1>\n<p>Template Entity Checker bietet zwei getrennte, kombinierbare Ausschlüsse. Beide bleiben im Sensor und in der Diagnostik transparent.<\/p>\n<h2>Exakte fehlende Entity-ID ignorieren<\/h2>\n<p>Nutze <strong>Exakt zu ignorierende Entity-IDs<\/strong>, wenn eine bestimmte Ziel-ID bewusst fehlen darf.<\/p>\n<pre><code class=\"language-text\">sensor.gartenhaus_beispiel_altwert\nbinary_sensor.werkstatt_beispiel_altkontakt<\/code><\/pre>\n<p>Die Auswahl ist durchsuchbar und kann mehrere Werte enthalten. Aktuelle Funde und bisherige Werte werden angeboten. Weil wirklich fehlende IDs oft nicht mehr in Home Assistant auswählbar sind, kannst du eine syntaktisch gültige Entity-ID auch frei eingeben.<\/p>\n<h3>Regeln<\/h3>\n<ul><li>nur vollständige Entity-IDs<\/li><li>keine Wildcards<\/li><li>Duplikate werden entfernt<\/li><li>die Existenz wird beim Speichern nicht verlangt<\/li><\/ul>\n<h2>Template-Helfer über Label ignorieren<\/h2>\n<p>Nutze <strong>Label für ignorierte Template-Helfer<\/strong>, wenn alle Funde aus bestimmten Helfern ausgeblendet werden sollen.<\/p>\n<ol><li>Lege in Home Assistant ein frei benanntes Label an oder nutze ein vorhandenes.<\/li><li>Weise es direkt der Entity zu, die der Template-Helfer erzeugt.<\/li><li>Suche und wähle dieses Label in den Optionen des Template Entity Checkers.<\/li><\/ol>\n<p>Das Label filtert die <strong>Quelle<\/strong>, nicht die fehlende Ziel-Entity. Geräte- und Bereichslabels werden nicht vererbt.<\/p>\n<p>Die Auswahl ist durchsuchbar, erlaubt keine freie Eingabe und speichert höchstens ein Label. Angeboten werden aktuelle Home-Assistant-Labels sowie gegebenenfalls die zuvor gespeicherte ID eines gelöschten Labels, damit sie entfernt werden kann.<\/p>\n<h3>Fundweise Trennung<\/h3>\n<p>Referenzieren ein gelabelter und ein ungelabelter Helfer dieselbe fehlende ID, bleibt der Fund des ungelabelten Helfers aktiv. Nur der Fund aus dem gelabelten Helfer wandert nach <code>ignored_matches<\/code>.<\/p>\n<h2>Transparenz<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribut<\/th><th>Inhalt<\/th><\/tr><\/thead><tbody><tr><td><code>missing_entities<\/code><\/td><td>aktive, nicht ignorierte Funde<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>konfigurierte exakte Ignore-IDs<\/td><\/tr><tr><td><code>ignored_helper_label<\/code><\/td><td>Label-ID, aktueller Name und Verfügbarkeit<\/td><\/tr><tr><td><code>ignored_helper_sources<\/code><\/td><td>tatsächlich über das Label ausgeschlossene Helfer<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>durch exakte ID oder Helfer-Label unterdrückte Funde<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Beispiel<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Entity<\/th><th>Quelle<\/th><th>Regel<\/th><th>Ergebnis<\/th><\/tr><\/thead><tbody><tr><td><code>sensor.gartenhaus_beispiel_altwert<\/code><\/td><td>beliebiger Helfer<\/td><td>exakte ID<\/td><td><code>ignored_matches<\/code><\/td><\/tr><tr><td><code>binary_sensor.werkstatt_beispiel_altkontakt<\/code><\/td><td>gelabelter Helfer<\/td><td>Helfer-Label<\/td><td><code>ignored_matches<\/code><\/td><\/tr><tr><td><code>binary_sensor.werkstatt_beispiel_altkontakt<\/code><\/td><td>ungelabelter Helfer<\/td><td>keine<\/td><td><code>missing_entities<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, "de/diagnostics": {"title": "Diagnostik", "html": "<h1>Diagnostik<\/h1>\n<p>Diagnostik kann unter <strong>Einstellungen → Geräte &amp; Dienste → Template Entity Checker<\/strong> heruntergeladen werden.<\/p>\n<h2>Inhalt<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Feld<\/th><th>Beschreibung<\/th><\/tr><\/thead><tbody><tr><td><code>integration_version<\/code><\/td><td>Version der Integration<\/td><\/tr><tr><td><code>config_entry<\/code><\/td><td><code>entry_id<\/code>, <code>version<\/code>, <code>minor_version<\/code>, Daten und Optionen<\/td><\/tr><tr><td><code>coordinator_available<\/code><\/td><td>ob der Coordinator geladen ist<\/td><\/tr><tr><td><code>last_update_success<\/code><\/td><td>ob der letzte Coordinator-Lauf erfolgreich war<\/td><\/tr><tr><td><code>last_exception<\/code><\/td><td>letzte Coordinator-Exception<\/td><\/tr><tr><td><code>scan<\/code><\/td><td>vollständige Daten des letzten Scans<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Die Scan-Daten enthalten unter anderem aktive und ignorierte Funde, Parser-Diagnosen, Quell-Ladefehler sowie den Status des optionalen Helfer-Labels:<\/p>\n<ul><li><code>missing_entities<\/code><\/li><li><code>ignored_entities<\/code><\/li><li><code>ignored_helper_label<\/code><\/li><li><code>ignored_helper_sources<\/code><\/li><li><code>ignored_matches<\/code><\/li><li><code>parser_diagnostics<\/code><\/li><li><code>load_errors<\/code><\/li><li><code>template_types_scanned<\/code><\/li><li><code>sources_scanned<\/code><\/li><li><code>references_checked<\/code><\/li><li><code>last_scan<\/code><\/li><li><code>complete<\/code><\/li><li><code>status<\/code><\/li><\/ul>\n<h2>Redaktion<\/h2>\n<p>Schlüssel mit diesen Namen werden automatisch geschwärzt:<\/p>\n<pre><code class=\"language-json\">[&quot;access_token&quot;, &quot;password&quot;, &quot;token&quot;]<\/code><\/pre>\n<h2>Sicherheit<\/h2>\n<p>Prüfe Diagnosedaten trotzdem vor einem öffentlichen Upload. Access-Tokens, Passwörter, private Home-Assistant-URLs und persönliche Namen gehören nicht in ein GitHub-Issue.<\/p>"}, "de/limitations": {"title": "Bekannte Grenzen", "html": "<h1>Bekannte Grenzen<\/h1>\n<h2>Nur UI-basierte Template-Helfer<\/h2>\n<p>Templates aus <code>configuration.yaml<\/code>, <code>templates.yaml<\/code>, Packages oder anderen YAML-Dateien werden <strong>nicht<\/strong> gescannt. Home Assistant bietet keine stabile öffentliche API, um alle ursprünglichen YAML-Template-Quellen aufzuzählen.<\/p>\n<h2>Kein Rendern<\/h2>\n<p>Jinja wird <strong>nicht<\/strong> gerendert oder semantisch ausgeführt. Die konservative statische Extraktion erkennt nur direkte, statische Referenzen. Indirekte Referenzen werden bewusst nicht erkannt.<\/p>\n<h2>Dynamische Referenzen<\/h2>\n<p>Dynamisch konstruierte Entity-IDs können nicht aufgelöst werden:<\/p>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.&#x27; ~ variable) }}           ← nicht auflösbar\n{{ state_attr(entity_variable, &#x27;attribute&#x27;) }} ← nicht auflösbar<\/code><\/pre>\n<p>Sie erzeugen Parser-Diagnostik, aber nie eine erfundene fehlende Entity.<\/p>\n<h2>Internes Schema<\/h2>\n<p>Die öffentliche Config-Entry-API wird nur lesend genutzt. Das interne Options-Feld-Schema der <code>template<\/code>-Integration kann sich mit HA-Releases ändern. Zugriff ist in <code>template_sources.py<\/code> isoliert und getestet. Unbekannte neuere Schema-Versionen werden als Lade-Fehler gemeldet, nicht geraten.<\/p>\n<h2>Kein Scan anderer Bereiche<\/h2>\n<p>Templates in Automatisierungen, Scripts, Szenen, Dashboards, Blueprints und anderen Integrationen werden <strong>nicht<\/strong> gescannt.<\/p>\n<h2>Keine Reparatur<\/h2>\n<p>Die Integration meldet Probleme, repariert aber keine Referenzen und bietet keine automatischen Reparaturen an.<\/p>\n<h2>Attribut-Größenlimit<\/h2>\n<p>Sehr große Ergebnisse können das State-Attribut-Größenlimit von Home Assistant erreichen. Export- und Reparatur-Funktionen sind zukünftige Arbeit.<\/p>\n<h2>Was NICHT als fehlend gilt<\/h2>\n<ul><li>Entities mit Status <code>unavailable<\/code> — solange Registry-Eintrag existiert<\/li><li>Entities mit Status <code>unknown<\/code> — solange Registry-Eintrag existiert<\/li><li>Entities mit Status <code>disabled<\/code> — solange Registry-Eintrag existiert<\/li><li>Entities ohne aktuellen State — solange Registry-Eintrag existiert<\/li><\/ul>"}, "de/troubleshooting": {"title": "Fehlerbehebung", "html": "<h1>Fehlerbehebung<\/h1>\n<h2>Sensor zeigt <code>waiting<\/code><\/h2>\n<p>Der erste Scan startet erst, wenn Home Assistant vollständig läuft. Kurz nach einem Neustart ist <code>waiting<\/code> normal. Warte kurz oder rufe <code>template_entity_checker.scan_now<\/code> auf.<\/p>\n<h2><code>load_errors<\/code> enthält Einträge<\/h2>\n<p>Mindestens eine Template-Quelle konnte nicht sicher geladen werden.<\/p>\n<ol><li>Prüfe <code>load_errors<\/code> und <code>last_error<\/code> im Sensor.<\/li><li>Prüfe, ob der genannte Template-Helfer noch existiert.<\/li><li>Achte nach einem Home-Assistant-Update auf eine neuere, noch unbestätigte Config-Entry-Schemaversion.<\/li><li>Starte einen neuen Scan.<\/li><\/ol>\n<p>Ein partieller Lauf löscht keine bestehende Benachrichtigung und setzt keine neue Event-Baseline.<\/p>\n<h2><code>parser_diagnostics<\/code> enthält Einträge<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Bedeutung<\/th><\/tr><\/thead><tbody><tr><td><code>dynamic_entity_reference<\/code><\/td><td>Entity-ID ist dynamisch und kann statisch nicht bewiesen werden<\/td><\/tr><tr><td><code>invalid_static_entity_id<\/code><\/td><td>statischer Wert hat kein gültiges Entity-ID-Format<\/td><\/tr><tr><td><code>template_syntax_error<\/code><\/td><td>Jinja-Syntax ist ungültig<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Dynamische Hinweise sind nicht zwingend Fehler im Template. Der Checker rät solche IDs bewusst nicht.<\/p>\n<h2>Fehlende Entity wird nicht gemeldet<\/h2>\n<p>Mögliche Ursachen:<\/p>\n<ol><li>Sie besitzt noch einen Eintrag in der Entity Registry.<\/li><li>Ihre exakte ID steht in <code>ignored_entities<\/code>; prüfe <code>ignored_matches<\/code>.<\/li><li>Der Fund stammt aus einem Helfer mit dem gewählten Ignore-Label; prüfe <code>ignored_helper_sources<\/code> und <code>ignored_matches<\/code>.<\/li><li>Die Referenz ist dynamisch; prüfe <code>parser_diagnostics<\/code>.<\/li><li>Das Template stammt aus YAML, einer Automation, einem Script, Dashboard oder einer anderen nicht unterstützten Quelle.<\/li><\/ol>\n<h2>Helfer-Label wirkt nicht<\/h2>\n<ul><li>Das Label muss direkt an der vom Template-Helfer erzeugten Entity gesetzt sein.<\/li><li>Geräte- und Bereichslabels werden nicht vererbt.<\/li><li>Prüfe <code>ignored_helper_label.available<\/code>.<\/li><li>Nach Löschen des gespeicherten Labels werden absichtlich keine Quellen mehr ausgeschlossen.<\/li><\/ul>\n<h2>Gespeichertes Label erscheint nur als ID<\/h2>\n<p>Das Label wurde wahrscheinlich gelöscht. Öffne die Optionen, entferne die alte Auswahl oder wähle ein vorhandenes Label. Der Scan läuft währenddessen konservativ ohne labelbasierte Ausschlüsse weiter.<\/p>\n<h2>Benachrichtigung erscheint nicht<\/h2>\n<ul><li>Benachrichtigungen müssen aktiviert sein.<\/li><li><code>missing_entities<\/code> muss aktive Funde enthalten; ignorierte Funde allein erzeugen keine Benachrichtigung.<\/li><li>Ein partieller Scan verändert die bestehende Benachrichtigung nicht.<\/li><li>Ein identisches vollständiges Ergebnis erzeugt kein Duplikat.<\/li><\/ul>\n<h2>Fehlerbericht<\/h2>\n<ol><li>Neueste öffentliche Version prüfen.<\/li><li><code>template_entity_checker.scan_now<\/code> ausführen.<\/li><li>Sensorattribute und <a href=\"#de/diagnostics\" data-page-link=\"diagnostics\">Diagnostik<\/a> prüfen.<\/li><li>Reproduktionsschritte und bereinigte Diagnostik in einem GitHub-Issue bereitstellen.<\/li><\/ol>\n<p>Keine Zugangsdaten, privaten URLs oder persönlichen Daten veröffentlichen.<\/p>"}, "de/requirements": {"title": "Anforderungen", "html": "<h1>Anforderungen<\/h1>\n<h2>Laufzeit<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Anforderung<\/th><th>Version/Stand<\/th><\/tr><\/thead><tbody><tr><td>Home Assistant<\/td><td>2026.7.3 oder neuer<\/td><\/tr><tr><td>HACS<\/td><td>aktuelle Version für HACS-Installation<\/td><\/tr><tr><td>YAML-Konfiguration<\/td><td>nicht erforderlich und nicht unterstützt<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Integration<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Eigenschaft<\/th><th>Wert<\/th><\/tr><\/thead><tbody><tr><td>Integration Type<\/td><td><code>service<\/code><\/td><\/tr><tr><td>IoT Class<\/td><td><code>local_polling<\/code><\/td><\/tr><tr><td>Config Flow<\/td><td>ja<\/td><\/tr><tr><td>Config Entries<\/td><td>genau einer<\/td><\/tr><tr><td>Abhängigkeiten<\/td><td><code>persistent_notification<\/code>, <code>template<\/code><\/td><\/tr><tr><td>Plattform<\/td><td><code>sensor<\/code><\/td><\/tr><tr><td>erwartete Entity<\/td><td><code>sensor.template_entity_checker<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Sprachen<\/h2>\n<p>Englische und deutsche Oberflächentexte sind enthalten.<\/p>\n<h2>Veröffentlichungsstand<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Version<\/th><th>Stand<\/th><\/tr><\/thead><tbody><tr><td><code>0.1.3<\/code><\/td><td>aktuell veröffentlichte stabile Version<\/td><\/tr><tr><td><code>0.1.2<\/code><\/td><td>vorherige stabile Version<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Bei einer normalen HACS-Installation wird <code>0.1.3<\/code> als aktuelle stabile Version angeboten.<\/p>"}, "en/index": {"title": "Template Entity Checker", "html": "<h1>Template Entity Checker<\/h1>\n<p><strong>Documentation version: 0.1.3<\/strong> · Home Assistant custom integration<\/p>\n<p>Template Entity Checker scans Template Helpers created through the Home Assistant user interface for static entity references that no longer exist.<\/p>\n<p>The integration reads Template Helpers through the public Config Entry API. It <strong>never<\/strong> renders or changes templates, repairs references, guesses dynamic entity IDs, or reads or writes <code>.storage<\/code> files.<\/p>\n<blockquote>The current public stable version is <code>0.1.3<\/code>.<\/blockquote>\n<h2>Scope<\/h2>\n<p><strong>UI-created Template Helpers only.<\/strong> Templates from <code>configuration.yaml<\/code>, <code>templates.yaml<\/code>, packages, or other YAML files are not scanned.<\/p>\n<h2>New in 0.1.3<\/h2>\n<ul><li>searchable selection for the optional helper label; custom values are blocked, a previously saved deleted label ID remains visible so it can be cleared, and at most one label can be saved<\/li><\/ul>\n<h2>New in 0.1.2<\/h2>\n<ul><li><code>has_value<\/code> as a function, filter, and Jinja test<\/li><li>searchable multi-select for exact ignored entity IDs, while still allowing free entry of missing IDs<\/li><li>optional source-level exclusion using one freely selected Home Assistant label<\/li><li>transparent details about the effective label, ignored helpers, and ignored findings<\/li><li>native on/off control for persistent notifications<\/li><\/ul>\n<h2>Quick start<\/h2>\n<ol><li><a href=\"#en/installation\" data-page-link=\"installation\">Install<\/a> through HACS<\/li><li><a href=\"#en/configuration\" data-page-link=\"configuration\">Configure<\/a> under <strong>Settings → Devices &amp; services<\/strong><\/li><li><a href=\"#en/sensor\" data-page-link=\"sensor\">Review results<\/a> through <code>sensor.template_entity_checker<\/code><\/li><\/ol>\n<h2>Documentation<\/h2><div class=\"card-grid\"><a class=\"card\" href=\"#en/installation\" data-page-link=\"installation\"><strong>Installation<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/configuration\" data-page-link=\"configuration\"><strong>Configuration<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/how-it-works\" data-page-link=\"how-it-works\"><strong>How it works<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/supported-syntax\" data-page-link=\"supported-syntax\"><strong>Supported syntax<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/sensor\" data-page-link=\"sensor\"><strong>Result sensor<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/services\" data-page-link=\"services\"><strong>scan_now action<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/events\" data-page-link=\"events\"><strong>Events<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/notifications\" data-page-link=\"notifications\"><strong>Notifications<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/ignore-list\" data-page-link=\"ignore-list\"><strong>Exclusions<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/diagnostics\" data-page-link=\"diagnostics\"><strong>Diagnostics<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/limitations\" data-page-link=\"limitations\"><strong>Known limitations<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/troubleshooting\" data-page-link=\"troubleshooting\"><strong>Troubleshooting<\/strong><span>Open<\/span><\/a><a class=\"card\" href=\"#en/requirements\" data-page-link=\"requirements\"><strong>Requirements<\/strong><span>Open<\/span><\/a><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>Section<\/th><th>Contents<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#en/installation\" data-page-link=\"installation\">Installation<\/a><\/td><td>HACS and manual installation<\/td><\/tr><tr><td><a href=\"#en/configuration\" data-page-link=\"configuration\">Configuration<\/a><\/td><td>Config Flow, Options Flow, and settings<\/td><\/tr><tr><td><a href=\"#en/how-it-works\" data-page-link=\"how-it-works\">How it works<\/a><\/td><td>Scan process and Template Helper types<\/td><\/tr><tr><td><a href=\"#en/supported-syntax\" data-page-link=\"supported-syntax\">Supported syntax<\/a><\/td><td>Static Jinja references with examples<\/td><\/tr><tr><td><a href=\"#en/sensor\" data-page-link=\"sensor\">Result sensor<\/a><\/td><td>State and attributes<\/td><\/tr><tr><td><a href=\"#en/services\" data-page-link=\"services\">Action<\/a><\/td><td><code>template_entity_checker.scan_now<\/code><\/td><\/tr><tr><td><a href=\"#en/events\" data-page-link=\"events\">Events<\/a><\/td><td><code>template_entity_checker_result_changed<\/code><\/td><\/tr><tr><td><a href=\"#en/notifications\" data-page-link=\"notifications\">Notifications<\/a><\/td><td>Persistent notification behavior<\/td><\/tr><tr><td><a href=\"#en/ignore-list\" data-page-link=\"ignore-list\">Exclusions<\/a><\/td><td>Exact IDs and helper labels<\/td><\/tr><tr><td><a href=\"#en/diagnostics\" data-page-link=\"diagnostics\">Diagnostics<\/a><\/td><td>Diagnostics download and contents<\/td><\/tr><tr><td><a href=\"#en/limitations\" data-page-link=\"limitations\">Known limitations<\/a><\/td><td>What cannot be resolved<\/td><\/tr><tr><td><a href=\"#en/troubleshooting\" data-page-link=\"troubleshooting\">Troubleshooting<\/a><\/td><td>Narrow down common problems<\/td><\/tr><tr><td><a href=\"#en/requirements\" data-page-link=\"requirements\">Requirements<\/a><\/td><td>Versions and platforms<\/td><\/tr><\/tbody><\/table><\/div>"}, "en/installation": {"title": "Installation", "html": "<h1>Installation<\/h1>\n<p>Template Entity Checker is installed as a Home Assistant custom integration. The current public stable version is <code>0.1.3<\/code>.<\/p>\n<h2>Requirements<\/h2>\n<ul><li>Home Assistant 2026.7.3 or newer<\/li><li>a current HACS version<\/li><\/ul>\n<h2>Install through HACS<\/h2>\n<ol><li>Open <strong>HACS<\/strong> in Home Assistant.<\/li><li>Open the three-dot menu in the top-right corner.<\/li><li>Select <strong>Custom repositories<\/strong>.<\/li><li>Enter:<\/li><\/ol>\n<pre><code class=\"language-text\">   https://github.com/Dajwitt/template-entity-checker<\/code><\/pre>\n<ol start=\"5\"><li>Select the <strong>Integration<\/strong> category and add the repository.<\/li><li>Open <strong>Template Entity Checker<\/strong> in HACS and select <strong>Download<\/strong>.<\/li><li>Restart Home Assistant.<\/li><li>Continue with <a href=\"#en/configuration\" data-page-link=\"configuration\">Configuration<\/a>.<\/li><\/ol>\n<p>Do not add anything to <code>configuration.yaml<\/code>.<\/p>\n<h2>Manual installation<\/h2>\n<ol><li>Download the latest release from GitHub.<\/li><li>Copy <code>custom_components/template_entity_checker<\/code> to:<\/li><\/ol>\n<pre><code class=\"language-text\">   /config/custom_components/template_entity_checker<\/code><\/pre>\n<ol start=\"3\"><li>Restart Home Assistant.<\/li><li>Continue with <a href=\"#en/configuration\" data-page-link=\"configuration\">Configuration<\/a>.<\/li><\/ol>"}, "en/configuration": {"title": "Configuration", "html": "<h1>Configuration<\/h1>\n<p>Initial setup and later changes use Home Assistant's Config Flow and Options Flow. YAML configuration is neither required nor supported.<\/p>\n<h2>Initial setup<\/h2>\n<p>After installation and restart:<\/p>\n<ol><li>Open <strong>Settings → Devices &amp; services<\/strong>.<\/li><li>Select <strong>Add integration<\/strong>.<\/li><li>Search for <strong>Template Entity Checker<\/strong>.<\/li><li>Set the scan interval in minutes (default: 15).<\/li><li>Enable or disable persistent notifications.<\/li><li>Optionally select exact entity IDs to ignore or freely enter missing IDs.<\/li><li>Optionally search for and select a Home Assistant label to ignore complete Template Helper sources.<\/li><\/ol>\n<h2>Settings<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Default<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Scan interval<\/td><td>integer (1–1440)<\/td><td>15 minutes<\/td><td>Time between automatic scans<\/td><\/tr><tr><td>Notifications<\/td><td>on/off<\/td><td>on<\/td><td>Persistent notification for active findings<\/td><\/tr><tr><td>Exact entity IDs to ignore<\/td><td>searchable multi-select with custom values<\/td><td>empty<\/td><td>Suppresses the selected missing target IDs completely<\/td><\/tr><tr><td>Label for ignored Template Helpers<\/td><td>searchable selection without custom values, at most one<\/td><td>empty<\/td><td>Suppresses findings from helpers whose generated entity directly carries this label<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Searchable entity selection<\/h2>\n<p>The Options Flow offers:<\/p>\n<ul><li>currently reported missing entity IDs,<\/li><li>findings that were previously ignored,<\/li><li>already configured ignore IDs.<\/li><\/ul>\n<p>A truly missing entity may no longer exist in the Entity Registry, so any syntactically valid entity ID can still be entered manually.<\/p>\n<h2>Excluding helpers through a label<\/h2>\n<p>The optional label is selected from Home Assistant's current Label Registry and stored by its stable label ID.<\/p>\n<ul><li>The selection is searchable and does not allow custom values. It offers current labels and, when necessary, the previously configured ID of a deleted label so it can be cleared.<\/li><li>At most one label can be saved.<\/li><li>Assign the label directly to the entity created by the Template Helper.<\/li><li>Device and area labels are not inherited.<\/li><li>Renaming the label does not break the exclusion.<\/li><li>If the stored label is deleted, no helper remains excluded through it; the scan stays complete and reports the label as unavailable.<\/li><li>Exact IDs and the label exclusion can be used together.<\/li><\/ul>\n<h2>Options Flow<\/h2>\n<p>Change all fields under <strong>Settings → Devices &amp; services → Template Entity Checker → Configure<\/strong>. Saving reloads the integration and applies the new settings to the next scan.<\/p>\n<h2>Single instance and migration<\/h2>\n<p>Only one integration instance is supported. A second setup attempt is aborted.<\/p>\n<p>Version 1 Config Entries are migrated automatically to version 2. The retired Template Helper type selection is removed from data and options; all confirmed types are scanned automatically. Legacy text-based ignore values remain readable and are converted to the new list the next time settings are saved.<\/p>\n<h2>Intentional limits<\/h2>\n<ul><li>no wildcards such as <code>sensor.living_room_*<\/code><\/li><li>no selection of individual Template Helper types<\/li><li>no dashboard selection<\/li><li>no YAML configuration<\/li><\/ul>"}, "en/how-it-works": {"title": "How it works", "html": "<h1>How it works<\/h1>\n<h2>Scan process<\/h2>\n<pre><code class=\"language-text\">Home Assistant has fully started\n        │\n        ▼\nLoad UI-created Template Helpers through Config Entries\n        │\n        ▼\nExtract confirmed template fields\n        │\n        ▼\nParse Jinja statically, never render it\n        │\n        ▼\nCheck references against the state machine and Entity Registry\n        │\n        ▼\nApply exact ignore IDs and the direct helper label per finding\n        │\n        ▼\nUpdate the sensor\nUpdate the notification after a changed complete result\nFire an event after a changed complete result<\/code><\/pre>\n<h2>Loading Template Helpers<\/h2>\n<p>The integration uses Home Assistant's public Config Entry API in read-only mode.<\/p>\n<ul><li>no direct <code>.storage<\/code> access<\/li><li>no template rendering or execution<\/li><li>only confirmed <code>TemplateSelector<\/code> fields<\/li><li>confirmed schema versions 1.0 through 1.2<\/li><li>unknown or newer schemas are reported in <code>load_errors<\/code> instead of being guessed<\/li><\/ul>\n<h2>Supported Template Helper types<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Type<\/th><th>Scanned root fields<\/th><\/tr><\/thead><tbody><tr><td><code>alarm_control_panel<\/code><\/td><td><code>value_template<\/code><\/td><\/tr><tr><td><code>binary_sensor<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>button<\/code><\/td><td>no root fields<\/td><\/tr><tr><td><code>cover<\/code><\/td><td><code>state<\/code>, <code>position<\/code><\/td><\/tr><tr><td><code>device_tracker<\/code><\/td><td><code>in_zones<\/code>, <code>latitude<\/code>, <code>longitude<\/code><\/td><\/tr><tr><td><code>event<\/code><\/td><td><code>event_type<\/code>, <code>event_types<\/code><\/td><\/tr><tr><td><code>fan<\/code><\/td><td><code>state<\/code>, <code>percentage<\/code><\/td><\/tr><tr><td><code>image<\/code><\/td><td><code>url<\/code><\/td><\/tr><tr><td><code>light<\/code><\/td><td><code>state<\/code>, <code>level<\/code>, <code>hs<\/code>, <code>temperature<\/code><\/td><\/tr><tr><td><code>lock<\/code><\/td><td><code>state<\/code>, <code>code_format<\/code><\/td><\/tr><tr><td><code>number<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>select<\/code><\/td><td><code>state<\/code>, <code>options<\/code><\/td><\/tr><tr><td><code>sensor<\/code><\/td><td><code>state<\/code><\/td><\/tr><tr><td><code>switch<\/code><\/td><td><code>value_template<\/code><\/td><\/tr><tr><td><code>update<\/code><\/td><td><code>installed_version<\/code>, <code>latest_version<\/code>, <code>in_progress<\/code>, <code>release_summary<\/code>, <code>release_url<\/code>, <code>title<\/code>, <code>update_percentage<\/code><\/td><\/tr><tr><td><code>vacuum<\/code><\/td><td><code>state<\/code>, <code>fan_speed<\/code><\/td><\/tr><tr><td><code>weather<\/code><\/td><td><code>condition<\/code>, <code>humidity<\/code>, <code>temperature<\/code>, <code>forecast_daily<\/code>, <code>forecast_hourly<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Every type also checks <code>advanced_options.availability<\/code>. A <code>device_tracker<\/code> additionally checks <code>advanced_options.location_accuracy<\/code>. Missing fields are not counted as sources; present but empty fields are counted as scanned sources.<\/p>\n<h2>When is an entity missing?<\/h2>\n<p>An entity is reported only when it exists in neither the state machine nor the Entity Registry. An entity that is <code>unavailable<\/code>, <code>unknown<\/code>, disabled, or currently without a state is not missing while a registry entry still exists.<\/p>\n<h2>Exclusions<\/h2>\n<p>Exact ignore IDs suppress every finding for that target ID. The optional helper label is evaluated directly on the entities created by Template Helpers and suppresses only findings from those sources. Both exclusion paths move matching findings to <code>ignored_matches<\/code>.<\/p>\n<h2>Automatic and manual scans<\/h2>\n<p>The first scan starts after Home Assistant has fully started. Later scans follow the configured interval. The <code>template_entity_checker.scan_now<\/code> action requests an immediate run. An async lock prevents parallel scans; a concurrent trigger waits.<\/p>\n<h2>Partial failures<\/h2>\n<p>A source loading error produces <code>partial_error<\/code>. Successfully loaded sources remain visible in the sensor. An incomplete run changes neither the current notification nor the event result baseline.<\/p>\n<h2>Grouping<\/h2>\n<p>Findings are grouped by entity ID. For each helper, field, and reference, the result retains the helper name, type, source ID, original reference, occurrence count, and every line and column location.<\/p>"}, "en/supported-syntax": {"title": "Supported syntax", "html": "<h1>Supported syntax<\/h1>\n<p>Template Entity Checker extracts <strong>statically provable<\/strong> entity references from Jinja templates. Templates are never rendered. The parser analyzes syntax, source positions, and local name bindings.<\/p>\n<h2>Function calls<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.living_room_example_temperature&#x27;) }}\n{{ state_attr(&#x27;sensor.living_room_example_temperature&#x27;, &#x27;temperature&#x27;) }}\n{{ is_state(&#x27;binary_sensor.patio_example_contact&#x27;, &#x27;on&#x27;) }}\n{{ is_state_attr(&#x27;sensor.heating_example_status&#x27;, &#x27;mode&#x27;, &#x27;heating&#x27;) }}\n{{ has_value(&#x27;sensor.garden_room_example_value&#x27;) }}<\/code><\/pre>\n<h2><code>has_value<\/code> as filter and test<\/h2>\n<p>Home Assistant supports three <code>has_value<\/code> forms, and all three are checked:<\/p>\n<pre><code class=\"language-jinja2\">{{ has_value(&#x27;sensor.garden_room_example_value&#x27;) }}\n{{ &#x27;sensor.garden_room_example_value&#x27; | has_value }}\n{{ &#x27;sensor.garden_room_example_value&#x27; is has_value }}\n{{ &#x27;sensor.garden_room_example_value&#x27; is not has_value }}<\/code><\/pre>\n<p>Parenthesized string literals are supported as well. Dynamic operands produce a diagnostic, never a guessed finding.<\/p>\n<pre><code class=\"language-jinja2\">{{ entity_variable | has_value }}\n{{ entity_variable is has_value }}<\/code><\/pre>\n<h2>Dot notation<\/h2>\n<pre><code class=\"language-jinja2\">{{ states.sensor.living_room_example_temperature.state }}\n{{ states.binary_sensor.patio_example_contact }}<\/code><\/pre>\n<h2><code>expand()<\/code><\/h2>\n<pre><code class=\"language-jinja2\">{{ expand([&#x27;sensor.living_room_example_temperature&#x27;, &#x27;sensor.basement_example_temperature&#x27;]) }}\n{{ expand(&#x27;sensor.living_room_example_temperature&#x27;, &#x27;sensor.basement_example_temperature&#x27;) }}<\/code><\/pre>\n<p>Literal entity IDs in lists, tuples, and multiple arguments are checked individually. In mixed containers, static elements are checked and the dynamic remainder produces exactly one diagnostic.<\/p>\n<h2>Lookalikes intentionally ignored<\/h2>\n<p>The following are not static Home Assistant references:<\/p>\n<ul><li>function names in plain text or Jinja comments<\/li><li>text inside a string literal that merely looks like a call<\/li><li>same-named methods on another object, such as <code>helper.expand(...)<\/code><\/li><li>macro names, filter-block names, and ordinary Jinja test names<\/li><li>locally bound names that replace a global Home Assistant function<\/li><\/ul>\n<p><code>has_value<\/code> is the deliberate exception for Jinja filters and tests because Home Assistant officially exposes those forms.<\/p>\n<pre><code class=\"language-jinja2\">{# states(&#x27;sensor.comment_example&#x27;) #}\n{{ &quot;states(&#x27;sensor.string_example&#x27;)&quot; }}\n{{ helper.expand([&#x27;sensor.method_example&#x27;]) }}\n{{ expand([&#x27;sensor.real_example_finding&#x27;]) }}<\/code><\/pre>\n<h2>Local variables and scopes<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.before_binding_example&#x27;) }}\n{% set states = local_helper %}\n{{ states(&#x27;sensor.after_binding_example&#x27;) }}<\/code><\/pre>\n<p>The first global call remains detectable. After the local binding, <code>states<\/code> is no longer treated as the Home Assistant function. A binding in a child scope does not hide a later global call outside that scope.<\/p>\n<h2>Dynamic references<\/h2>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.&#x27; ~ room) }}\n{{ state_attr(entity_variable, &#x27;temperature&#x27;) }}\n{{ expand([&#x27;sensor.living_room_example_temperature&#x27;, entity_variable]) }}<\/code><\/pre>\n<p>Dynamic IDs are not resolved. They produce <code>dynamic_entity_reference<\/code>, but never a fabricated missing entity.<\/p>\n<h2>Duplicates and locations<\/h2>\n<p>Multiple occurrences of the same ID are grouped into one finding per helper, field, and reference. <code>occurrence_count<\/code> and every line and column position are preserved.<\/p>"}, "en/sensor": {"title": "Result sensor", "html": "<h1>Result sensor<\/h1>\n<p>The integration normally creates <code>sensor.template_entity_checker<\/code>. Home Assistant's Entity Registry remains authoritative, so users can rename the entity.<\/p>\n<h2>State<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>State<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>0<\/code><\/td><td>no active missing entities<\/td><\/tr><tr><td><code>N<\/code><\/td><td>N unique missing, non-ignored entity IDs<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Attributes<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribute<\/th><th>Type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><code>status<\/code><\/td><td>string<\/td><td><code>ok<\/code>, <code>missing_entities<\/code>, <code>partial_error<\/code>, <code>update_failed<\/code>, or <code>waiting<\/code><\/td><\/tr><tr><td><code>complete<\/code><\/td><td>bool<\/td><td><code>true<\/code> when every source loaded successfully<\/td><\/tr><tr><td><code>scan_interval_minutes<\/code><\/td><td>int<\/td><td>configured scan interval<\/td><\/tr><tr><td><code>template_types_scanned<\/code><\/td><td>list<\/td><td>Template Helper types actually scanned<\/td><\/tr><tr><td><code>sources_scanned<\/code><\/td><td>int<\/td><td>number of template fields scanned<\/td><\/tr><tr><td><code>references_checked<\/code><\/td><td>int<\/td><td>number of statically extracted reference occurrences<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>dict<\/td><td>active findings grouped by entity ID<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>list<\/td><td>configured exact ignore IDs<\/td><\/tr><tr><td><code>ignored_helper_label<\/code><\/td><td>dict/null<\/td><td>label ID, current name, and availability<\/td><\/tr><tr><td><code>ignored_helper_sources<\/code><\/td><td>list<\/td><td>helpers actually excluded through the label<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>dict<\/td><td>findings suppressed through either exclusion type<\/td><\/tr><tr><td><code>parser_diagnostics<\/code><\/td><td>list<\/td><td>dynamic, invalid, or syntactically broken references<\/td><\/tr><tr><td><code>load_errors<\/code><\/td><td>list<\/td><td>source loading errors<\/td><\/tr><tr><td><code>last_scan<\/code><\/td><td>string/null<\/td><td>ISO timestamp of the last scan<\/td><\/tr><tr><td><code>last_error<\/code><\/td><td>string/null<\/td><td>last coordinator exception<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Example active finding<\/h2>\n<pre><code class=\"language-yaml\">sensor.garden_room_example_old_value:\n  - helper: Garden room average\n    source_type: template_helper\n    source_id: example_internal_id\n    template_field: state\n    template_type: sensor\n    reference: &quot;states(&#x27;sensor.garden_room_example_old_value&#x27;)&quot;\n    occurrence_count: 1\n    locations:\n      - line: 4\n        column: 2<\/code><\/pre>\n<h2>Example selected helper label<\/h2>\n<pre><code class=\"language-yaml\">ignored_helper_label:\n  label_id: example_ignore_check\n  name: Ignore check\n  available: true\nignored_helper_sources:\n  - source_id: example_helper_entry_id\n    helper: Garden room comparison<\/code><\/pre>\n<p>If the stored label is later deleted, its ID remains transparent, <code>name<\/code> becomes <code>null<\/code>, <code>available<\/code> becomes <code>false<\/code>, and no sources are excluded through it.<\/p>\n<h2>Status values<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Status<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>ok<\/code><\/td><td>complete scan without active findings<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>complete scan with active findings<\/td><\/tr><tr><td><code>partial_error<\/code><\/td><td>at least one source could not be loaded<\/td><\/tr><tr><td><code>update_failed<\/code><\/td><td>the entire coordinator update failed<\/td><\/tr><tr><td><code>waiting<\/code><\/td><td>integration loaded; the first scan has not run yet<\/td><\/tr><\/tbody><\/table><\/div>"}, "en/services": {"title": "Action", "html": "<h1>Action<\/h1>\n<h2><code>template_entity_checker.scan_now<\/code><\/h2>\n<p>Immediately scans every UI-created Template Helper.<\/p>\n<h3>Parameters<\/h3>\n<p>None.<\/p>\n<h3>Developer Tools example<\/h3>\n<pre><code class=\"language-yaml\">action: template_entity_checker.scan_now<\/code><\/pre>\n<h3>Script example<\/h3>\n<pre><code class=\"language-yaml\">script:\n  template_check:\n    alias: &quot;Template check&quot;\n    sequence:\n      - action: template_entity_checker.scan_now<\/code><\/pre>\n<h3>Serialization<\/h3>\n<p>If another scan is active, the action waits for the scan lock. Scans never run in parallel.<\/p>"}, "en/events": {"title": "Events", "html": "<h1>Events<\/h1>\n<h2><code>template_entity_checker_result_changed<\/code><\/h2>\n<p>After the first complete scan establishes a baseline, the integration fires this event whenever the structured active <code>missing_entities<\/code> findings change.<\/p>\n<h3>When does it fire?<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Condition<\/th><th>Fires?<\/th><\/tr><\/thead><tbody><tr><td>Result changes after the baseline<\/td><td>yes<\/td><\/tr><tr><td>Result stays identical<\/td><td>no<\/td><\/tr><tr><td>One or more sources fail to load<\/td><td>no<\/td><\/tr><tr><td>First complete scan establishes the baseline<\/td><td>no<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Event data<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><code>previous_count<\/code><\/td><td>int<\/td><td>previous number of missing entity IDs<\/td><\/tr><tr><td><code>current_count<\/code><\/td><td>int<\/td><td>current number of missing entity IDs<\/td><\/tr><tr><td><code>added_entities<\/code><\/td><td>list<\/td><td>newly missing entity IDs, sorted<\/td><\/tr><tr><td><code>removed_entities<\/code><\/td><td>list<\/td><td>entity IDs that are no longer missing, sorted<\/td><\/tr><tr><td><code>missing_entities<\/code><\/td><td>dict<\/td><td>complete current finding structure<\/td><\/tr><tr><td><code>scan_time<\/code><\/td><td>string<\/td><td>ISO scan timestamp<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Event trigger example<\/h3>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;Template findings changed&quot;\n    trigger:\n      - platform: event\n        event_type: template_entity_checker_result_changed\n    action:\n      - action: persistent_notification.create\n        data:\n          title: &quot;Template check updated&quot;\n          message: &gt;\n            {{ trigger.event.data.previous_count }} →\n            {{ trigger.event.data.current_count }} missing entities.\n            Added: {{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}<\/code><\/pre>\n<h3>Only react to new findings<\/h3>\n<pre><code class=\"language-yaml\">automation:\n  - alias: &quot;New missing Template entities&quot;\n    trigger:\n      - platform: event\n        event_type: template_entity_checker_result_changed\n    condition:\n      - condition: template\n        value_template: &quot;{{ trigger.event.data.added_entities | length &gt; 0 }}&quot;\n    action:\n      - action: persistent_notification.create\n        data:\n          title: &quot;New missing entities&quot;\n          message: &quot;{{ trigger.event.data.added_entities | join(&#x27;, &#x27;) }}&quot;<\/code><\/pre>"}, "en/notifications": {"title": "Notifications", "html": "<h1>Notifications<\/h1>\n<p>When notifications are enabled, the integration manages one persistent notification.<\/p>\n<h2>Behavior<\/h2>\n<ul><li>one fixed notification ID, so repeated scans do not create duplicates<\/li><li>only a changed complete result updates the notification<\/li><li>identical results do not create another notification<\/li><li>findings are grouped by Template Helper<\/li><li>a clean complete scan dismisses the notification<\/li><li>disabling notifications dismisses it as well<\/li><li>ignored findings alone do not create a notification<\/li><\/ul>\n<h2>Partial failures<\/h2>\n<p>A partial source loading failure leaves the existing notification unchanged. Incomplete input must not hide a real problem.<\/p>\n<h2>Example notification<\/h2>\n<pre><code class=\"language-text\">Template Entity Checker: 2 missing entities\n\n**Template Helpers**\n\nAverage humidity\n• sensor.living_room_docs_old_value\n• sensor.basement_docs_old_value\n\nComplete list: sensor attribute `missing_entities`<\/code><\/pre>\n<h2>Language<\/h2>\n<p>The title and message follow Home Assistant's configured language. English and German are supported.<\/p>"}, "en/ignore-list": {"title": "Exclusions", "html": "<h1>Exclusions<\/h1>\n<p>Template Entity Checker provides two independent exclusions that can be combined. Both remain transparent in the sensor and diagnostics.<\/p>\n<h2>Ignore an exact missing entity ID<\/h2>\n<p>Use <strong>Exact entity IDs to ignore<\/strong> when a specific target ID is intentionally allowed to be missing.<\/p>\n<pre><code class=\"language-text\">sensor.garden_room_example_old_value\nbinary_sensor.workshop_example_old_contact<\/code><\/pre>\n<p>The searchable selection accepts multiple values. Current findings and previous values are offered. Because a missing ID may no longer exist in Home Assistant, any syntactically valid entity ID can also be entered manually.<\/p>\n<h3>Rules<\/h3>\n<ul><li>complete entity IDs only<\/li><li>no wildcards<\/li><li>duplicates are removed<\/li><li>the entity does not need to exist when settings are saved<\/li><\/ul>\n<h2>Ignore Template Helpers through a label<\/h2>\n<p>Use <strong>Label for ignored Template Helpers<\/strong> when every finding from selected helpers should be suppressed.<\/p>\n<ol><li>Create a freely named label in Home Assistant or reuse an existing one.<\/li><li>Assign it directly to the entity created by the Template Helper.<\/li><li>Search for and select that label in the Template Entity Checker options.<\/li><\/ol>\n<p>The label filters the <strong>source<\/strong>, not the missing target entity. Device and area labels are not inherited.<\/p>\n<p>The selection is searchable, does not allow custom values, and saves at most one label. It offers current Home Assistant labels and, when necessary, the previously configured ID of a deleted label so it can be cleared.<\/p>\n<h3>Per-finding partitioning<\/h3>\n<p>If a labeled and an unlabeled helper reference the same missing ID, the unlabeled helper's finding remains active. Only the labeled helper's finding moves to <code>ignored_matches<\/code>.<\/p>\n<h2>Transparency<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Attribute<\/th><th>Contents<\/th><\/tr><\/thead><tbody><tr><td><code>missing_entities<\/code><\/td><td>active, non-ignored findings<\/td><\/tr><tr><td><code>ignored_entities<\/code><\/td><td>configured exact ignore IDs<\/td><\/tr><tr><td><code>ignored_helper_label<\/code><\/td><td>label ID, current name, and availability<\/td><\/tr><tr><td><code>ignored_helper_sources<\/code><\/td><td>helpers actually excluded through the label<\/td><\/tr><tr><td><code>ignored_matches<\/code><\/td><td>findings suppressed by an exact ID or helper label<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Example<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Entity<\/th><th>Source<\/th><th>Rule<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><code>sensor.garden_room_example_old_value<\/code><\/td><td>any helper<\/td><td>exact ID<\/td><td><code>ignored_matches<\/code><\/td><\/tr><tr><td><code>binary_sensor.workshop_example_old_contact<\/code><\/td><td>labeled helper<\/td><td>helper label<\/td><td><code>ignored_matches<\/code><\/td><\/tr><tr><td><code>binary_sensor.workshop_example_old_contact<\/code><\/td><td>unlabeled helper<\/td><td>none<\/td><td><code>missing_entities<\/code><\/td><\/tr><\/tbody><\/table><\/div>"}, "en/diagnostics": {"title": "Diagnostics", "html": "<h1>Diagnostics<\/h1>\n<p>Download diagnostics under <strong>Settings → Devices &amp; services → Template Entity Checker<\/strong>.<\/p>\n<h2>Contents<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td><code>integration_version<\/code><\/td><td>integration version<\/td><\/tr><tr><td><code>config_entry<\/code><\/td><td><code>entry_id<\/code>, <code>version<\/code>, <code>minor_version<\/code>, data, and options<\/td><\/tr><tr><td><code>coordinator_available<\/code><\/td><td>whether the coordinator is loaded<\/td><\/tr><tr><td><code>last_update_success<\/code><\/td><td>whether the last coordinator update succeeded<\/td><\/tr><tr><td><code>last_exception<\/code><\/td><td>last coordinator exception<\/td><\/tr><tr><td><code>scan<\/code><\/td><td>complete data from the latest scan<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The scan data includes active and ignored findings, parser diagnostics, source loading errors, and the status of the optional helper label:<\/p>\n<ul><li><code>missing_entities<\/code><\/li><li><code>ignored_entities<\/code><\/li><li><code>ignored_helper_label<\/code><\/li><li><code>ignored_helper_sources<\/code><\/li><li><code>ignored_matches<\/code><\/li><li><code>parser_diagnostics<\/code><\/li><li><code>load_errors<\/code><\/li><li><code>template_types_scanned<\/code><\/li><li><code>sources_scanned<\/code><\/li><li><code>references_checked<\/code><\/li><li><code>last_scan<\/code><\/li><li><code>complete<\/code><\/li><li><code>status<\/code><\/li><\/ul>\n<h2>Redaction<\/h2>\n<p>Keys with these names are automatically redacted:<\/p>\n<pre><code class=\"language-json\">[&quot;access_token&quot;, &quot;password&quot;, &quot;token&quot;]<\/code><\/pre>\n<h2>Security<\/h2>\n<p>Review diagnostics before uploading them publicly. Access tokens, passwords, private Home Assistant URLs, and personal names do not belong in a GitHub issue.<\/p>"}, "en/limitations": {"title": "Known limitations", "html": "<h1>Known limitations<\/h1>\n<h2>UI-created Template Helpers only<\/h2>\n<p>Templates from <code>configuration.yaml<\/code>, <code>templates.yaml<\/code>, packages, or other YAML files are <strong>not<\/strong> scanned. Home Assistant does not provide a stable public API for another integration to enumerate every original YAML template source.<\/p>\n<h2>No rendering<\/h2>\n<p>Jinja is <strong>not<\/strong> rendered or semantically executed. Conservative static extraction detects only direct, statically provable references. Indirect references are intentionally not detected.<\/p>\n<h2>Dynamic references<\/h2>\n<p>Dynamically constructed entity IDs cannot be resolved:<\/p>\n<pre><code class=\"language-jinja2\">{{ states(&#x27;sensor.&#x27; ~ variable) }}\n{{ state_attr(entity_variable, &#x27;attribute&#x27;) }}<\/code><\/pre>\n<p>They produce parser diagnostics, never fabricated missing entities.<\/p>\n<h2>Internal Template Helper schema<\/h2>\n<p>The public Config Entry API is used read-only, but the <code>template<\/code> integration's option-field structure is an internal schema that may change with Home Assistant releases. Access is isolated in <code>template_sources.py<\/code> and tested. Unknown newer schema versions produce source loading errors instead of being guessed.<\/p>\n<h2>Other sources are not scanned<\/h2>\n<p>Templates in automations, scripts, scenes, dashboards, blueprints, and other integrations are not scanned.<\/p>\n<h2>No repair<\/h2>\n<p>The integration reports problems but never changes or repairs references.<\/p>\n<h2>State attribute size<\/h2>\n<p>Very large result sets can approach Home Assistant's state attribute size limits. Export and Repairs integration are future work.<\/p>\

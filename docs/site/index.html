n<h2>Not considered missing<\/h2>\n<ul><li><code>unavailable<\/code> entities with a registry entry<\/li><li><code>unknown<\/code> entities with a registry entry<\/li><li>disabled entities with a registry entry<\/li><li>entities without a current state but with a registry entry<\/li><\/ul>"}, "en/troubleshooting": {"title": "Troubleshooting", "html": "<h1>Troubleshooting<\/h1>\n<h2>Sensor shows <code>waiting<\/code><\/h2>\n<p>The first scan starts only after Home Assistant is fully running. <code>waiting<\/code> is normal shortly after a restart. Wait briefly or call <code>template_entity_checker.scan_now<\/code>.<\/p>\n<h2><code>load_errors<\/code> contains entries<\/h2>\n<p>At least one Template source could not be loaded safely.<\/p>\n<ol><li>Review <code>load_errors<\/code> and <code>last_error<\/code> in the sensor.<\/li><li>Confirm that the named Template Helper still exists.<\/li><li>After a Home Assistant update, check whether the Config Entry uses a newer, unconfirmed schema version.<\/li><li>Start another scan.<\/li><\/ol>\n<p>A partial run does not dismiss an existing notification or establish a new event baseline.<\/p>\n<h2><code>parser_diagnostics<\/code> contains entries<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Code<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>dynamic_entity_reference<\/code><\/td><td>entity ID is dynamic and cannot be proven statically<\/td><\/tr><tr><td><code>invalid_static_entity_id<\/code><\/td><td>static value is not a valid entity ID<\/td><\/tr><tr><td><code>template_syntax_error<\/code><\/td><td>Jinja syntax is invalid<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A dynamic diagnostic does not necessarily mean the template is broken. The checker deliberately does not guess the ID.<\/p>\n<h2>A missing entity is not reported<\/h2>\n<p>Possible reasons:<\/p>\n<ol><li>It still has an Entity Registry entry.<\/li><li>Its exact ID is listed in <code>ignored_entities<\/code>; review <code>ignored_matches<\/code>.<\/li><li>The finding comes from a helper carrying the selected ignore label; review <code>ignored_helper_sources<\/code> and <code>ignored_matches<\/code>.<\/li><li>The reference is dynamic; review <code>parser_diagnostics<\/code>.<\/li><li>The template comes from YAML, an automation, script, dashboard, or another unsupported source.<\/li><\/ol>\n<h2>The helper label does not work<\/h2>\n<ul><li>Assign the label directly to the entity created by the Template Helper.<\/li><li>Device and area labels are not inherited.<\/li><li>Check <code>ignored_helper_label.available<\/code>.<\/li><li>After the stored label is deleted, no source is excluded through it by design.<\/li><\/ul>\n<h2>A stored label is shown only as an ID<\/h2>\n<p>The label was probably deleted. Open the options and remove the old selection or choose an existing label. The scan continues conservatively without label-based exclusions.<\/p>\n<h2>No notification appears<\/h2>\n<ul><li>Notifications must be enabled.<\/li><li><code>missing_entities<\/code> must contain active findings; ignored findings alone do not create a notification.<\/li><li>A partial scan leaves the current notification unchanged.<\/li><li>An identical complete result does not create a duplicate.<\/li><\/ul>\n<h2>Reporting a problem<\/h2>\n<ol><li>Confirm the latest public version is installed.<\/li><li>Run <code>template_entity_checker.scan_now<\/code>.<\/li><li>Review the sensor attributes and <a href=\"#en/diagnostics\" data-page-link=\"diagnostics\">Diagnostics<\/a>.<\/li><li>Provide reproduction steps and sanitized diagnostics in a GitHub issue.<\/li><\/ol>\n<p>Never publish credentials, private URLs, or personal data.<\/p>"}, "en/requirements": {"title": "Requirements", "html": "<h1>Requirements<\/h1>\n<h2>Runtime<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Requirement<\/th><th>Version/status<\/th><\/tr><\/thead><tbody><tr><td>Home Assistant<\/td><td>2026.7.3 or newer<\/td><\/tr><tr><td>HACS<\/td><td>current version for HACS installation<\/td><\/tr><tr><td>YAML configuration<\/td><td>neither required nor supported<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Integration<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Property<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Integration type<\/td><td><code>service<\/code><\/td><\/tr><tr><td>IoT class<\/td><td><code>local_polling<\/code><\/td><\/tr><tr><td>Config Flow<\/td><td>yes<\/td><\/tr><tr><td>Config Entries<\/td><td>exactly one<\/td><\/tr><tr><td>Dependencies<\/td><td><code>persistent_notification<\/code>, <code>template<\/code><\/td><\/tr><tr><td>Platform<\/td><td><code>sensor<\/code><\/td><\/tr><tr><td>Expected entity<\/td><td><code>sensor.template_entity_checker<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Languages<\/h2>\n<p>English and German user-interface translations are included.<\/p>\n<h2>Release status<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Version<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td><code>0.1.3<\/code><\/td><td>current public stable version<\/td><\/tr><tr><td><code>0.1.2<\/code><\/td><td>previous stable version<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A normal HACS installation offers <code>0.1.3<\/code> as the current stable version.<\/p>"}}, "navigation": {"de": [{"group": "Start", "items": [{"slug": "index", "title": "Übersicht"}]}, {"group": "Erste Schritte", "items": [{"slug": "installation", "title": "Installation"}, {"slug": "configuration", "title": "Konfiguration"}, {"slug": "how-it-works", "title": "Funktionsweise"}]}, {"group": "Funktionen", "items": [{"slug": "supported-syntax", "title": "Unterstützte Syntax"}, {"slug": "sensor", "title": "Result-Sensor"}, {"slug": "services", "title": "Aktion scan_now"}, {"slug": "events", "title": "Events"}, {"slug": "notifications", "title": "Benachrichtigungen"}, {"slug": "ignore-list", "title": "Ausschlüsse"}, {"slug": "diagnostics", "title": "Diagnostik"}]}, {"group": "Referenz", "items": [{"slug": "limitations", "title": "Bekannte Grenzen"}, {"slug": "troubleshooting", "title": "Fehlerbehebung"}, {"slug": "requirements", "title": "Anforderungen"}]}], "en": [{"group": "Start", "items": [{"slug": "index", "title": "Overview"}]}, {"group": "Getting started", "items": [{"slug": "installation", "title": "Installation"}, {"slug": "configuration", "title": "Configuration"}, {"slug": "how-it-works", "title": "How it works"}]}, {"group": "Features", "items": [{"slug": "supported-syntax", "title": "Supported syntax"}, {"slug": "sensor", "title": "Result sensor"}, {"slug": "services", "title": "scan_now action"}, {"slug": "events", "title": "Events"}, {"slug": "notifications", "title": "Notifications"}, {"slug": "ignore-list", "title": "Exclusions"}, {"slug": "diagnostics", "title": "Diagnostics"}]}, {"group": "Reference", "items": [{"slug": "limitations", "title": "Known limitations"}, {"slug": "troubleshooting", "title": "Troubleshooting"}, {"slug": "requirements", "title": "Requirements"}]}]}, "ui": {"de": {"menu": "Menü", "open": "Öffnen", "toc": "Auf dieser Seite", "search": "Dokumentation filtern", "light": "Hell", "dark": "Dunkel"}, "en": {"menu": "Menu", "open": "Open", "toc": "On this page", "search": "Filter documentation", "light": "Light", "dark": "Dark"}}},pages=data.pages,navigation=data.navigation,ui=data.ui;
let currentLanguage='en',currentSlug='index';
function slugify(value){return value.toLowerCase().replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function filterNavigation(query){const q=query.toLowerCase();document.querySelectorAll('.nav-group').forEach(group=>{let visible=0;group.querySelectorAll('a').forEach(a=>{const show=a.textContent.toLowerCase().includes(q);a.style.display=show?'block':'none';visible+=show});group.style.display=visible?'block':'none'})}
function closeMobileMenu(){document.querySelector('.sidebar').classList.remove('open');document.getElementById('mobile-overlay').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
function toggleMobileMenu(){const open=!document.querySelector('.sidebar').classList.contains('open');document.querySelector('.sidebar').classList.toggle('open',open);document.getElementById('mobile-overlay').classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))}
function renderNavigation(language){document.getElementById('navigation').innerHTML=navigation[language].map(group=>`<section class="nav-group"><h2>${group.group}</h2>${group.items.map(item=>`<a href="#${language}/${item.slug}" data-page="${item.slug}">${item.title}</a>`).join('')}</section>`).join('');const search=document.getElementById('search');search.placeholder=ui[language].search;filterNavigation(search.value);document.querySelectorAll('#navigation a').forEach(a=>a.addEventListener('click',closeMobileMenu))}
function loadPage(language,slug,section=null){const key=`${language}/${slug}`;if(!pages[key]){language='en';slug='index'}currentLanguage=language;currentSlug=slug;localStorage.setItem('tec-doc-language',language);document.documentElement.lang=language;renderNavigation(language);document.getElementById('menu-toggle').textContent=ui[language].menu;document.getElementById('light').textContent=ui[language].light;document.getElementById('dark').textContent=ui[language].dark;const page=pages[`${language}/${slug}`];document.title=page.title+' – Template Entity Checker';const content=document.getElementById('content');content.innerHTML=page.html;document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===slug));content.querySelectorAll('[data-page-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash=`${language}/${a.dataset.pageLink}`}));const headings=[...content.querySelectorAll('h2')];headings.forEach((h,i)=>h.id=slugify(h.textContent)||'section-'+i);document.getElementById('toc').innerHTML=`<strong>${ui[language].toc}</strong>`+headings.map(h=>`<a href="#${language}/${slug}:${h.id}">${h.textContent}</a>`).join('');document.querySelectorAll('[id^="lang-"]').forEach(b=>b.classList.toggle('active',b.id===`lang-${language}`));closeMobileMenu();if(section){document.getElementById(section)?.scrollIntoView({behavior:'instant',block:'start'})}else{window.scrollTo(0,0)}}
function route(){const [path,section]=location.hash.slice(1).split(':',2);if(path.includes('/')){const [language,slug]=path.split('/',2);loadPage(language,slug,section||null)}else{const saved=localStorage.getItem('tec-doc-language');const detected=navigator.language.toLowerCase().startsWith('de')?'de':'en';const language=saved&&navigation[saved]?saved:detected;location.replace(`#${language}/index`)}}
function switchLanguage(language){document.getElementById('search').value='';location.hash=`${language}/${currentSlug}`}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('tec-doc-theme',theme);document.querySelectorAll('#light,#dark').forEach(b=>b.classList.toggle('active',b.id===theme))}
document.getElementById('search').addEventListener('input',e=>filterNavigation(e.target.value));window.addEventListener('hashchange',route);setTheme(localStorage.getItem('tec-doc-theme')||'light');route();
</script>
